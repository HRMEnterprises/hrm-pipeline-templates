name: .NET PR Checks (Reusable)

# workflow_call means this file is NOT triggered by GitHub events directly.
# It only runs when another repo's wrapper file explicitly calls it via `uses:`.
on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version to use
        type: string
        required: false
        default: "8.0.x"

jobs:
  # Runs CSharpier formatting check and dotnet build as separate parallel jobs.
  # Parallel jobs give faster feedback -- a formatting miss comes back in seconds
  # without waiting for the full build to finish first.

  format-check:
    name: CSharpier Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Checks out the PR branch so we're validating the actual incoming code,
        # not whatever is already on main.

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
        # Installs the .NET SDK on the runner. We expose this as an input so
        # repos targeting a different SDK version can override it without
        # forking the shared workflow.

      - name: Install CSharpier
        run: dotnet tool install -g csharpier
        # Installs CSharpier globally on the runner for this job.
        # Global install means we can call `dotnet csharpier` as a plain command.

      - name: Run CSharpier check
        run: dotnet csharpier check .
        # Check-only mode -- does not modify files, just exits non-zero if
        # any file is not formatted correctly. A non-zero exit fails the job
        # and blocks the PR from merging (if branch protection requires this check).

  build:
    name: dotnet build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # packages: read is required for GITHUB_TOKEN to authenticate against
      # GitHub Packages when resolving internal NuGet dependencies (e.g. AppCommonCore).
      # Without this explicit declaration, orgs with restrictive default token
      # permissions will produce a 403 on dotnet restore.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Write nuget.config
        run: |
          cat > nuget.config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="github" value="https://nuget.pkg.github.com/HRMEnterprises/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="x-access-token" />
                <add key="ClearTextPassword" value="%NUGET_AUTH_TOKEN%" />
              </github>
            </packageSourceCredentials>
          </configuration>
          EOF
        # Writes the nuget.config inline rather than fetching it from the
        # hrm-pipeline-templates repo. An authenticated curl against an internal
        # repo adds complexity; writing inline keeps the build job self-contained
        # with no external dependencies.

      - name: Restore dependencies
        run: dotnet restore
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        # github.token (equivalent to secrets.GITHUB_TOKEN) is automatically
        # injected by GitHub into every workflow run for free -- no secrets
        # setup needed. The nuget.config reads it via the %NUGET_AUTH_TOKEN%
        # placeholder to authenticate against GitHub Packages.
        # We use github.token rather than secrets.GITHUB_TOKEN here because
        # github.token is always the calling repo's token regardless of how
        # the workflow was invoked, which is what NuGet needs.

      - name: Build
        run: dotnet build --configuration Release --no-restore
        # --no-restore skips a redundant second restore since we just did it above.
        # Release config catches any configuration-specific build issues that
        # Debug mode might silently ignore.
